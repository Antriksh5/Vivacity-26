# Single-domain deployment; replace /opt/vivacity-27 if extracted elsewhere.
server {
    listen 80;
    server_name _;
    root /opt/vivacity-27/CA_V2/client/dist;
    index index.html;
    include /etc/nginx/mime.types;

    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ca-api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /registration {
        alias /opt/vivacity-27/viva-26/dist/index.html;
        default_type text/html;
    }
    location = /registration/ {
        return 302 /registration$is_args$args;
    }
    location ~* ^/normalregistration/?$ {
        return 302 /registration$is_args$args;
    }
    location /registration-app/ {
        alias /opt/vivacity-27/viva-26/dist/;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
